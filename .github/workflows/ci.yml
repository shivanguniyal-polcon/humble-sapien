name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The invariant suite: battery, econometrics, PIT, simplifier, sanitize,
      # legal review, API, docx, datapoint, atlas, india locator. Eleven
      # suites that must pass on every commit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
