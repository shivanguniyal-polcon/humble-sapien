name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a moving major tag: whoever controls the
      # upstream account must not be able to change what runs on a push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The invariant suite: battery, econometrics, PIT, simplifier, sanitize,
      # legal review, API, docx, datapoint, atlas, india locator. Eleven
      # suites that must pass on every commit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
