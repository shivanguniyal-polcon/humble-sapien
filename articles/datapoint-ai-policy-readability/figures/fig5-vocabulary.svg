<text x="48" y="824" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" opacity="1">Nearest-neighbour check</text>
<text x="48" y="846" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start" opacity="1">For 146 Indian provisions, the closest provision in the whole non-Indian corpus sits in the North 61 times and in the South 85 times (exact binomial p = 0.0566).</text>
<text x="48" y="866" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start" opacity="1">A nearest neighbour is not proof of copying: two legal systems can use the same words for different reasons. It is evidence of shared legal vocabulary, and nothing more.</text>
<line x1="48" y1="746" x2="1132" y2="746" stroke="#e5e7eb" stroke-width="1" opacity="1" stroke-linecap="butt"/>
<text x="48" y="768" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start" opacity="1">Source: Data Point analysis. Share = provisions in the region whose text contains the term (stemmed for single words).</text>
<text x="48" y="786" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" opacity="0.85">Word rows are the highest-share Northern vocabulary that also appears in India. Phrase rows are matched as written.</text>
